<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seat Finder</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="hero-card p-4 p-md-5 shadow-sm">
            <div class="text-center mb-4">
              <span class="badge rounded-pill bg-primary-subtle text-primary fw-semibold px-3 py-2">Seat Locator</span>
              <h1 class="display-6 fw-bold mt-3 mb-2">Find your room instantly</h1>
              <p class="text-muted mb-0">Enter your seat number and select a category to locate the correct room.</p>
            </div>

            <form class="row g-3 align-items-end" onsubmit="event.preventDefault(); searchSeat();">
              <div class="col-md-5">
                <label for="username" class="form-label fw-semibold">Seat Number</label>
                <input type="text" id="username" class="form-control form-control-lg" placeholder="e.g. 2601023" inputmode="numeric" />
              </div>

              <div class="col-md-5">
                <label for="category" class="form-label fw-semibold">Category</label>
                <select id="category" class="form-select form-select-lg">
                  <option value="">Select Category</option>
                  <option value="Math">Math</option>
                  <option value="Science">Science</option>
                  <option value="Quiz">Quiz</option>
                  <option value="Mathematics_and_Science">Mathematics & Science</option>
                </select>
              </div>

              <div class="col-md-2">
                <button type="submit" class="btn btn-primary btn-lg w-100">Search</button>
              </div>
            </form>

            <div class="result mt-4 text-center" id="result">
              <div class="result-placeholder">Your room will appear here.</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
